<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms & inputs</title>
</head>
<body>
    <h1> exercise 04: Registration Form </h1>
    <form action="#" method="post">
        <p>
            <label for="fullname">full name:</label><br>
            <input type="text" id="fullname" name="fullname" required minlength="3">
        </p>
        <p>
            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required>
        </p>
        <p>
         <label for="password">password</label><br>
         <input type="password" id="password" name="password" required minlength="8"
        </p>
        <p>
            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>
            
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
        </p>
        <p>
            <label for="role">Role:</label><br>
            <select id="role" name="role" required>
                <option value="">-- Select a Role --</option>
                <option value="student">Student</option>
                <option value="developer">Developer</option>
            </select>
        </p>
        <p>
            <label for="bio">Bio:</label><br>
            <textarea id="bio" name="bio" rows="4" cols="40" minlength="10" placeholder="Tell us about yourself..."></textarea>
        </p>
        <p>
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the terms and conditions</label>
        </p>
        <p>
            <button type="submit">Register</button>
        </p>
    </form>
</body>
</html>
